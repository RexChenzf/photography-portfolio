<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chen ZhuoFeng - Photography</title>
    <link rel="stylesheet" href="styles.css">
    <style type="text/css">
        body {
            font-size: 12px;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #666;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- 左侧菜单 -->
    <div id="menu">
        <div class="title">
            <img src="images/avatar.jpg" width="55" height="55" alt="Avatar" onerror="this.style.display='none'">
            <p><a href=".">Chen ZhuoFeng</a></p>
        </div>
        <ul>
            <li><a href="#home" data-tab="home" class="active">首页</a></li>
            <li><a href="#gallery" data-tab="gallery">作品</a></li>
            <li><a href="#about" data-tab="about">关于</a></li>
        </ul>
        <p class="links"><a href="#links" data-tab="links">Links</a></p>
    </div>

    <!-- 主内容区 -->
    <div id="content">

        <!-- 首页 -->
        <div id="tab-home" class="tab-content active">
            <div id="home-featured">
                <!-- 封面大图由 JS 动态加载 -->
            </div>
            <div class="home-caption">
                <span class="home-name">Chen ZhuoFeng</span>
                <span class="home-desc">Photography</span>
            </div>
        </div>

        <!-- 作品 -->
        <div id="tab-gallery" class="tab-content">
            <div class="section-title">作品</div>
            <div id="slideshow">
                <!-- 图片动态加载到这里 -->
            </div>
            <div class="slide-nav">
                <a href="#" id="prev">‹</a>
                <span id="counter">1 / 7</span>
                <a href="#" id="next">›</a>
            </div>
        </div>

        <!-- 关于 -->
        <div id="tab-about" class="tab-content">
            <div class="section-title">关于</div>
            <div class="about-body">
                <img src="images/avatar.jpg" alt="avatar" class="about-avatar" onerror="this.style.display='none'">
                <div class="about-text">
                    <!-- 在这里填写自我介绍 -->
                    <p>在这里填写你的自我介绍。告诉访客你是谁、你关注什么题材、你的摄影理念是什么。</p>
                    <p>可以介绍你的器材、拍摄风格，或者分享一些拍摄经历和感悟。</p>
                </div>
            </div>
        </div>

        <!-- Links -->
        <div id="tab-links" class="tab-content">
            <div class="section-title">Links</div>
            <ul class="link-list">
                <li><a href="mailto:rexchenzf@outlook.com">📧 rexchenzf@outlook.com</a></li>
                <li><a href="https://github.com/RexChenzf" target="_blank">🐙 github.com/RexChenzf</a></li>
                <li><a href="#">📸 Instagram（请替换）</a></li>
                <li><a href="#">📱 微信（请替换）</a></li>
            </ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
